const ORDER = ['seo','payfit','marathon','thelook','mirakl'];
let lang = localStorage.getItem('lang') || 'fr';
let openId = null;

function tick() {
    const n = new Date();
    document.getElementById('mbTime').textContent =
        `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
tick(); setInterval(tick, 10000);

function renderGrid() {
    const g = document.getElementById('mcGrid');
    g.innerHTML = '';
    ORDER.forEach(id => {
        const p = P[id], d = p[lang];
        const w = document.createElement('div');
        w.className = 'mc-win';
        w.onclick = () => openProj(id);
        w.innerHTML = `
            <div class="mc-accent" style="background:${p.color}"></div>
            <div class="mc-titlebar">
                <div class="tl r"></div><div class="tl y"></div><div class="tl g"></div>
                <span class="mc-wtitle">${d.wt}</span>
            </div>
            <div class="mc-body">
                <div class="mc-ico">${p.icon}</div>
                <div class="mc-k1">${d.k1}</div>
                <div class="mc-k2">${d.k2}</div>
                <div class="mc-tags">${p.tags.slice(0,3).map(t=>`<span class="mc-tag">${t}</span>`).join('')}</div>
            </div>`;
        g.appendChild(w);
    });
}

function renderOverlays() {
    const c = document.getElementById('ovContainer');
    c.innerHTML = '';
    const L = lang;
    const backLbl  = L==='fr' ? 'Mission Control' : 'Mission Control';
    const escLbl   = L==='fr' ? 'Échap'           : 'Esc';
    const ctxLbl   = L==='fr' ? 'Contexte'        : 'Context';
    const mLbl     = L==='fr' ? "Ce que j'ai fait": 'What I built';
    const ghLbl    = L==='fr' ? 'Voir sur GitHub'  : 'View on GitHub';

    ORDER.forEach(id => {
        const p = P[id], d = p[L];
        const ov = document.createElement('div');
        ov.className = 'ov'; ov.id = `ov-${id}`;

        const metrics = d.metrics.map(m=>`
            <div class="ov-metric">
                <div class="ov-mval" style="color:${p.color}">${m.v}</div>
                <div class="ov-mlbl">${m.l}</div>
            </div>`).join('');
        const tags    = p.tags.map(t=>`<span class="ov-tag">${t}</span>`).join('');
        const mission = d.mission.map(m=>`<li>${m}</li>`).join('');
        const links   = p.github ? `<a href="${p.github}" target="_blank" class="ov-btn">⌨️ ${ghLbl}</a>` : '';

        ov.innerHTML = `
            <div class="ov-bar">
                <div class="ov-traffic">
                    <div class="ovtl r" onclick="closeProj()" title="${L==='fr'?'Fermer':'Close'}"></div>
                    <div class="ovtl y"></div>
                    <div class="ovtl g"></div>
                </div>
                <span class="ov-bartitle">${d.wt}</span>
                <button class="ov-back" onclick="closeProj()">
                    ← ${backLbl}
                    <span class="ov-back-esc">${escLbl}</span>
                </button>
            </div>
            <div class="ov-body">
                <div class="ov-hero">
                    <div class="ov-emoji">${p.icon}</div>
                    <div>
                        <div class="ov-name">${d.title}</div>
                        <div class="ov-sub">${d.sub}</div>
                    </div>
                </div>
                <div class="ov-tags">${tags}</div>
                <div class="ov-h">${ctxLbl}</div>
                <p class="ov-p">${d.ctx}</p>
                <div class="ov-h">${mLbl}</div>
                <ul class="ov-list">${mission}</ul>
                <div class="ov-h">${d.rh}</div>
                <div class="ov-metrics">${metrics}</div>
                <div class="ov-h">${d.lh}</div>
                <p class="ov-p">${d.learned}</p>
                ${links}
                <div class="ov-footer">
                    <button class="ov-footer-btn" onclick="closeProj()">← ${backLbl}</button>
                </div>
            </div>`;
        c.appendChild(ov);
    });
}

function openProj(id) {
    openId = id;
    document.getElementById('mc').classList.add('blurred');
    document.getElementById(`ov-${id}`).classList.add('open');
}

function closeProj() {
    if (!openId) return;
    document.getElementById(`ov-${openId}`).classList.remove('open');
    document.getElementById('mc').classList.remove('blurred');
    openId = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProj(); });

const UI = {
    fr:{"mb-title":"Projets Pro","mc-label":"Mission Control — Projets Pro","mc-hint":"Cliquez sur un projet pour l'explorer","d-home":"Accueil","d-perso":"Projets Perso","d-pro":"Projets Pro"},
    en:{"mb-title":"Pro Projects","mc-label":"Mission Control — Pro Projects","mc-hint":"Click on a project to explore it","d-home":"Home","d-perso":"Personal Projects","d-pro":"Pro Projects"}
};

function setLang(l) {
    lang = l; localStorage.setItem('lang', l);
    document.querySelectorAll('[data-i18n]').forEach(el => {
        if (UI[l][el.dataset.i18n]) el.textContent = UI[l][el.dataset.i18n];
    });
    document.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.textContent.toLowerCase() === l)
    );
    const was = openId;
    if (was) closeProj();
    renderGrid(); renderOverlays();
    if (was) openProj(was);
}

function go(url) { location.href = url; }

renderGrid();
renderOverlays();
setLang(lang);
</script>
</body>
</html>
