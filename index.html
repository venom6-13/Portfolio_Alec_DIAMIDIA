/* ── MÉTRIQUES ANIMÉES ── */
(function(){
  function animateVal(el) {
    const target   = +el.dataset.target;
    const prefix   = el.dataset.prefix   || '';
    const suffix   = el.dataset.suffix   || '';
    const divide   = el.dataset.divide ? +el.dataset.divide : 1;
    const fmt      = el.dataset.format;
    const duration = 1600;
    const start    = performance.now();

    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const ease = p < 0.5 ? 2*p*p : -1+(4-2*p)*p;
      const cur = Math.round(target * ease);
      const display = divide > 1 ? (cur/divide).toFixed(1) : cur;
      const formatted = fmt === 'k' ? (cur > 999 ? Math.round(cur/1000)*1000 + '' : cur).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u202F') : display;
      el.textContent = prefix + formatted + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.querySelectorAll('.metric-val').forEach(animateVal);
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.3 });

  const sec = document.getElementById('metricsSection');
  if (sec) io.observe(sec);
})();

const SUGGESTIONS = ['Ses projets','Sa stack','Son expérience','Le contacter'];
let imsgOpen = false;
let imsgInited = false;

function toggleImsg() {
  imsgOpen = !imsgOpen;
  const win = document.getElementById('imsgWin');
  win.classList.toggle('open', imsgOpen);
  document.getElementById('imsgNotif').style.display = 'none';
  if (imsgOpen && !imsgInited) {
    imsgInited = true;
    setTimeout(() => imsgBotMsg("Salut 👋 C'est Alec — enfin, mon assistant IA. Pose-moi une question sur mes projets, mes compétences ou pour me contacter !"), 400);
    setTimeout(() => renderSuggs(), 900);
  }
  if (imsgOpen) setTimeout(() => document.getElementById('imsgInput').focus(), 300);
}

function imsgBotMsg(text) {
  const msgs = document.getElementById('imsgMsgs');
  // Typing indicator
  const tw = document.createElement('div');
  tw.className = 'bubble-wrap alec';
  tw.innerHTML = '<div class="bubble-typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  msgs.appendChild(tw);
  msgs.scrollTop = msgs.scrollHeight;

  setTimeout(() => {
    tw.remove();
    const bw = document.createElement('div');
    bw.className = 'bubble-wrap alec';
    bw.innerHTML = `<div class="bubble" style="white-space:pre-line">${text}</div>`;
    msgs.appendChild(bw);
    msgs.scrollTop = msgs.scrollHeight;
  }, 900 + Math.random()*600);
}

function imsgUserMsg(text) {
  const msgs = document.getElementById('imsgMsgs');
  const bw = document.createElement('div');
  bw.className = 'bubble-wrap me';
  bw.innerHTML = `<div class="bubble">${text}</div><div class="bubble-status">Envoyé</div>`;
  msgs.appendChild(bw);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderSuggs() {
  const el = document.getElementById('imsgSuggs');
  el.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'imsg-sugg'; btn.textContent = s;
    btn.onclick = () => { el.innerHTML=''; imsgUserMsg(s); getBotReply(s.toLowerCase()); };
    el.appendChild(btn);
  });
}

function imsgSend() {
  const inp = document.getElementById('imsgInput');
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  document.getElementById('imsgSuggs').innerHTML = '';
  imsgUserMsg(text);
  getBotReply(text.toLowerCase());
}

function getBotReply(text) {
  let resp = null;
  for (const item of IMSG_KB) {
    if (item.k.some(k => text.includes(k))) { resp = item.r; break; }
  }
  if (!resp) {
    if (text.includes('merci') || text.includes('thanks')) resp = "Avec plaisir ! N'hésite pas si tu as d'autres questions 😊";
    else resp = "Je ne suis pas sûr de comprendre. Tu peux me demander sur mes projets, ma stack, mon expérience ou pour me contacter !";
  }
  imsgBotMsg(resp);
}
</script>
